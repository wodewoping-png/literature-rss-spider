name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-report.txt

      - name: Install test dependencies
        run: pip install -r requirements-report.txt

      - name: Compile Python sources
        run: python -m compileall -q -x '(output|filtered_news|csv|\.git)' .

      - name: Run offline unit tests
        env:
          GOOGLE_AI_API_KEY: ""
          GEMINI_API_KEY: ""
        run: python -m unittest discover -v

      - name: Reject Gemini API integrations
        shell: bash
        run: |
          if grep -RniE 'generativelanguage|google_ai_api_key|gemini_api_key|gemini-[0-9]|_build_gemini|gemini_generate' \
            --include='*.py' --include='*.yml' --include='*.yaml' \
            --exclude-dir=output --exclude-dir=filtered_news --exclude-dir=csv .; then
            echo "Gemini API integration detected. Classification must use Codex."
            exit 1
          fi
