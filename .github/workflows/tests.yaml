name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GEMINI_NETWORK_DISABLED: "1"
  GOOGLE_AI_API_KEY: ""
  GEMINI_API_KEY: ""

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-report.txt

      - name: Install offline test dependencies
        run: |
          pip install -r requirements-report.txt
          pip install numpy

      - name: Compile Python sources
        run: python -m compileall -q -x '(output|filtered_news|csv|\.git)' .

      - name: Run unit tests without Gemini network access
        run: python -m unittest discover -v
