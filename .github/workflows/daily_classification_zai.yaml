name: Daily Literature Classification (Z.AI GLM-5.2)

on:
  # Start only after the existing daily spider workflow has completed. This
  # avoids racing a long-running scrape with a fixed second cron time.
  workflow_run:
    workflows:
      - RSS Spider + Weekly Aggregate with Abstracts
      - Daily Gap Backfill and Alert
    types:
      - completed
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        required: true
        default: daily
        type: choice
        options:
          - api-test
          - daily
          - weekly
          - all
      force_reclassify:
        description: Reclassify the latest daily CSV even if an output workbook exists
        required: false
        default: false
        type: boolean
      source_filter:
        description: Optional exact source labels separated by | for a targeted catch-up
        required: false
        default: ""
        type: string
      output_tag:
        description: Optional output suffix for a targeted catch-up
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: daily-literature-classification-zai-${{ github.event.inputs.output_tag || 'default' }}
  cancel-in-progress: false

jobs:
  probe-api:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'api-test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install probe dependency
        run: pip install requests

      - name: Test all GLM-5.2 routes
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_MODEL: glm-5.2
        run: python scripts/test_zai_routes.py

  classify-daily:
    if: >-
      (github.event_name == 'workflow_run' &&
       (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.name == 'Daily Gap Backfill and Alert')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'daily' || github.event.inputs.task == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Detect unclassified daily CSV
        id: daily_input
        shell: bash
        env:
          FORCE_RECLASSIFY: ${{ github.event.inputs.force_reclassify }}
          OUTPUT_TAG: ${{ github.event.inputs.output_tag }}
        run: |
          latest="$(find output -maxdepth 1 -type f -name 'news_with_abstract_*.csv' | sort | tail -n 1)"
          if [ -z "$latest" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No daily CSV found."
            exit 0
          fi

          name="$(basename "${latest%.csv}")"
          output_tag="$(printf '%s' "$OUTPUT_TAG" | tr -cd '[:alnum:]_-')"
          if [ -n "$output_tag" ]; then
            output="output/daily_classified/${name}_${output_tag}_zai_classified.xlsx"
          else
            output="output/daily_classified/${name}_zai_classified.xlsx"
          fi
          signature="${output}.source.sha256"
          current_hash="$(sha256sum "$latest" | awk '{print $1}')"
          echo "input=$latest" >> "$GITHUB_OUTPUT"
          echo "output=$output" >> "$GITHUB_OUTPUT"
          if [ "$FORCE_RECLASSIFY" != "true" ] &&
             [ -f "$output" ] && [ -f "$signature" ] &&
             [ "$(tr -d '[:space:]' < "$signature")" = "$current_hash" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Daily CSV content is already classified: $latest"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Will translate/classify new or changed content: $latest"
          fi

      - name: Set up Python
        if: steps.daily_input.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache embedding models
        if: steps.daily_input.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-cache-${{ runner.os }}-v2

      - name: Install dependencies
        if: steps.daily_input.outputs.run == 'true'
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Translate with Google and classify with GLM-5.2
        if: steps.daily_input.outputs.run == 'true'
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_MODEL: glm-5.2
          ZAI_BASE_URL: https://api.z.ai/api/paas/v4
          ZAI_PROTOCOL: openai
          BIGMODEL_BASE_URL: https://open.bigmodel.cn/api/paas/v4
          ZAI_FALLBACK_BASE_URL: https://open.bigmodel.cn/api/anthropic
          ZAI_FALLBACK_PROTOCOL: anthropic
          ZAI_MAX_RETRIES: "3"
          ZAI_CLASSIFY_MAX_RETRIES: "3"
          ZAI_RETRY_BASE_SECONDS: "4"
          ZAI_RETRY_MAX_SECONDS: "30"
          TRANSLATE_FALLBACK_PROVIDER: llm
          SOURCE_FILTER: ${{ github.event.inputs.source_filter }}
          OUTPUT_TAG: ${{ github.event.inputs.output_tag }}
          TRANSLATE_BATCH_SIZE_ABSTRACT: "6"
        shell: bash
        run: |
          args=(
            -i "${{ steps.daily_input.outputs.input }}"
            -c classification.txt
            --translation-provider google
          )
          if [ -n "$OUTPUT_TAG" ]; then
            args+=(--output-tag "$OUTPUT_TAG")
          fi
          if [ -n "$SOURCE_FILTER" ]; then
            IFS='|' read -ra sources <<< "$SOURCE_FILTER"
            for source in "${sources[@]}"; do
              args+=(--source "$source")
            done
          fi
          python classify_daily_zai.py "${args[@]}"

      - name: Commit daily classification
        if: steps.daily_input.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add "${{ steps.daily_input.outputs.output }}"
          git add "${{ steps.daily_input.outputs.output }}.source.sha256"
          git add output/checkpoints/*zai_classified* || true
          if git diff --cached --quiet; then
            echo "No daily classification changes to commit"
            exit 0
          fi

          git commit -m "chore: daily Z.AI classified xlsx (UTC $(date -u +'%Y-%m-%d'))"
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main

  aggregate-weekly:
    needs: classify-daily
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.classify-daily.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'weekly') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'all' && needs.classify-daily.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Decide whether weekly aggregation is due
        id: weekly_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "5" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout latest main including daily result
        if: steps.weekly_gate.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Set up Python
        if: steps.weekly_gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install aggregation dependencies
        if: steps.weekly_gate.outputs.run == 'true'
        run: pip install pandas openpyxl python-docx

      - name: Merge the seven daily classified workbooks
        if: steps.weekly_gate.outputs.run == 'true'
        run: python aggregate_daily_classified.py -c classification.txt --days 7

      - name: Commit weekly merged workbook
        if: steps.weekly_gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add output/weekly_classified/*.xlsx || true
          if git diff --cached --quiet; then
            echo "No new weekly workbook; repeated aggregation was skipped"
            exit 0
          fi

          git commit -m "chore: weekly merge of daily classified xlsx (UTC $(date -u +'%Y-%m-%d'))"
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main
