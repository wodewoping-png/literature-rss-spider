name: Daily Literature Classification (Z.AI GLM-5.3-Flash)

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        required: true
        default: daily
        type: choice
        options:
          - api-test
          - daily
          - weekly
          - all
      force_reclassify:
        description: Reclassify the latest daily CSV even if an output workbook exists
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: daily-literature-classification-zai
  cancel-in-progress: false

jobs:
  probe-api:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'api-test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install probe dependency
        run: pip install requests

      - name: Test all GLM-5.3-Flash routes
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_MODEL: glm-5.3-flash
        run: python scripts/test_zai_routes.py

  classify-daily:
    if: github.event.inputs.task == 'daily' || github.event.inputs.task == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Detect unclassified daily CSV
        id: daily_input
        shell: bash
        env:
          FORCE_RECLASSIFY: ${{ github.event.inputs.force_reclassify }}
          DAILY_CLASSIFICATION_START_DATE: "2026-10-17"
        run: python scripts/select_daily_classification.py

      - name: Set up Python
        if: steps.daily_input.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.daily_input.outputs.run == 'true'
        run: |
          python -m pip install -U pip
          pip install pandas openpyxl python-docx requests

      - name: Translate with free routes and classify by industry taxonomy
        if: steps.daily_input.outputs.run == 'true'
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_MODEL: glm-5.3-flash
          ZAI_BASE_URL: https://api.z.ai/api/coding/paas/v4
          ZAI_PROTOCOL: openai
          BIGMODEL_BASE_URL: https://open.bigmodel.cn/api/paas/v4
          ZAI_FALLBACK_BASE_URL: https://open.bigmodel.cn/api/anthropic
          ZAI_FALLBACK_PROTOCOL: anthropic
          ZAI_MAX_RETRIES: "3"
          ZAI_CLASSIFY_MAX_RETRIES: "3"
          ZAI_RETRY_BASE_SECONDS: "4"
          ZAI_RETRY_MAX_SECONDS: "30"
          FREE_TRANSLATE_ROUTES: googleapis,google,clients5,mymemory
          GOOGLE_TRANSLATE_MAX_RETRIES: "2"
          MYMEMORY_DAILY_CHAR_BUDGET: "4500"
          TRANSLATE_FALLBACK_PROVIDER: llm
          TRANSLATE_BATCH_SIZE_ABSTRACT: "6"
        shell: bash
        run: |
          args=(
            -i "${{ steps.daily_input.outputs.input }}"
            --taxonomy config/monthly/industry_taxonomy.json
            --translation-provider google
          )
          python classify_daily_industry.py "${args[@]}"

      - name: Commit daily classification
        if: always() && steps.daily_input.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add -- "${{ steps.daily_input.outputs.output }}" 2>/dev/null || true
          git add -- output/checkpoints/*zai_classified_translation.csv 2>/dev/null || true
          git add -- output/checkpoints/industry_classification.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No daily classification or checkpoint changes to commit"
            exit 0
          fi

          if [ -f "${{ steps.daily_input.outputs.output }}" ]; then
            message="chore: daily Z.AI classified xlsx"
          else
            message="chore: preserve partial daily translation checkpoint"
          fi
          git commit -m "$message (UTC $(date -u +'%Y-%m-%d'))"
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main

  aggregate-weekly:
    needs: classify-daily
    if: >-
      always() && !cancelled() &&
      (github.event.inputs.task == 'weekly' ||
       (github.event.inputs.task == 'daily' && needs.classify-daily.result == 'success') ||
       (github.event.inputs.task == 'all' && needs.classify-daily.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main including daily result
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Wait for Friday daily classification (Asia/Shanghai)
        id: weekly_gate
        run: python scripts/weekly_classification_gate.py

      - name: Set up Python
        if: steps.weekly_gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install aggregation dependencies
        if: steps.weekly_gate.outputs.run == 'true'
        run: pip install pandas openpyxl python-docx

      - name: Merge the seven daily classified workbooks
        if: steps.weekly_gate.outputs.run == 'true'
        run: >-
          python aggregate_daily_classified.py -c classification.txt --days 7
          --end-date "${{ steps.weekly_gate.outputs.end_date }}"

      - name: Commit weekly merged workbook
        if: steps.weekly_gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add output/weekly_classified/*.xlsx || true
          if git diff --cached --quiet; then
            echo "No new weekly workbook; repeated aggregation was skipped"
            exit 0
          fi

          git commit -m "chore: weekly merge of daily classified xlsx (UTC $(date -u +'%Y-%m-%d'))"
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main
