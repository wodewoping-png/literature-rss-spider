name: Daily Literature Classification (Z.AI GLM-5.2)

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        required: true
        default: daily
        type: choice
        options:
          - api-test
          - daily
          - weekly
          - all
      force_reclassify:
        description: Reclassify the latest daily CSV even if an output workbook exists
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: daily-literature-classification-zai
  cancel-in-progress: false

jobs:
  probe-api:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'api-test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install probe dependency
        run: pip install requests

      - name: Test all GLM-5.2 routes
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_MODEL: glm-5.2
        run: python scripts/test_zai_routes.py

  classify-daily:
    if: github.event.inputs.task == 'daily' || github.event.inputs.task == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Detect unclassified daily CSV
        id: daily_input
        shell: bash
        env:
          FORCE_RECLASSIFY: ${{ github.event.inputs.force_reclassify }}
        run: |
          latest=""
          output=""

          # Pick the newest CSV whose corresponding workbook is missing or
          # stale. This also lets repeated runs drain a multi-day backlog.
          while IFS= read -r candidate; do
            name="$(basename "${candidate%.csv}")"
            candidate_output="output/daily_classified/${name}_zai_classified.xlsx"
            current_hash="$(sha256sum "$candidate" | awk '{print $1}')"
            stored_hash=""
            if [ -f "$candidate_output" ]; then
              stored_hash="$(
                unzip -p "$candidate_output" docProps/core.xml 2>/dev/null |
                  grep -oE 'source_sha256=[0-9a-f]{64}' |
                  head -n 1 |
                  cut -d= -f2 || true
              )"
            fi

            legacy_is_current="false"
            if [ -f "$candidate_output" ] && [ -z "$stored_hash" ]; then
              source_commit="$(git log -1 --format=%H -- "$candidate" || true)"
              output_commit="$(git log -1 --format=%H -- "$candidate_output" || true)"
              if [ -n "$source_commit" ] && [ -n "$output_commit" ] &&
                 git merge-base --is-ancestor "$source_commit" "$output_commit"; then
                legacy_is_current="true"
              fi
            fi

            if [ "$FORCE_RECLASSIFY" = "true" ] ||
               [ ! -f "$candidate_output" ] ||
               { [ -n "$stored_hash" ] && [ "$stored_hash" != "$current_hash" ]; } ||
               { [ -z "$stored_hash" ] && [ "$legacy_is_current" != "true" ]; }; then
              latest="$candidate"
              output="$candidate_output"
              break
            fi
          done < <(find output -maxdepth 1 -type f -name 'news_with_abstract_*.csv' | sort -r)

          if [ -z "$latest" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No new or changed daily CSV needs classification."
            exit 0
          fi

          echo "input=$latest" >> "$GITHUB_OUTPUT"
          echo "output=$output" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "Will translate/classify newest pending content: $latest"

      - name: Set up Python
        if: steps.daily_input.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache embedding models
        if: steps.daily_input.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-cache-${{ runner.os }}-v2

      - name: Install dependencies
        if: steps.daily_input.outputs.run == 'true'
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Translate with Google and classify with GLM-5.2
        if: steps.daily_input.outputs.run == 'true'
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_MODEL: glm-5.2
          ZAI_BASE_URL: https://api.z.ai/api/paas/v4
          ZAI_PROTOCOL: openai
          BIGMODEL_BASE_URL: https://open.bigmodel.cn/api/paas/v4
          ZAI_FALLBACK_BASE_URL: https://open.bigmodel.cn/api/anthropic
          ZAI_FALLBACK_PROTOCOL: anthropic
          ZAI_MAX_RETRIES: "3"
          ZAI_CLASSIFY_MAX_RETRIES: "3"
          ZAI_RETRY_BASE_SECONDS: "4"
          ZAI_RETRY_MAX_SECONDS: "30"
          TRANSLATE_FALLBACK_PROVIDER: llm
          TRANSLATE_BATCH_SIZE_ABSTRACT: "6"
        shell: bash
        run: |
          args=(
            -i "${{ steps.daily_input.outputs.input }}"
            -c classification.txt
            --translation-provider google
          )
          python classify_daily_zai.py "${args[@]}"

      - name: Commit daily classification
        if: steps.daily_input.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add "${{ steps.daily_input.outputs.output }}"
          git add output/checkpoints/*zai_classified* || true
          if git diff --cached --quiet; then
            echo "No daily classification changes to commit"
            exit 0
          fi

          git commit -m "chore: daily Z.AI classified xlsx (UTC $(date -u +'%Y-%m-%d'))"
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main

  aggregate-weekly:
    needs: classify-daily
    if: >-
      always() && !cancelled() &&
      (github.event.inputs.task == 'weekly' ||
       (github.event.inputs.task == 'daily' && needs.classify-daily.result == 'success') ||
       (github.event.inputs.task == 'all' && needs.classify-daily.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Decide whether weekly aggregation is due
        id: weekly_gate
        shell: bash
        run: |
          if [ "${{ github.event.inputs.task }}" = "weekly" ] || [ "${{ github.event.inputs.task }}" = "all" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.task }}" = "daily" ] && [ "$(date -u +%u)" = "5" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout latest main including daily result
        if: steps.weekly_gate.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Set up Python
        if: steps.weekly_gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install aggregation dependencies
        if: steps.weekly_gate.outputs.run == 'true'
        run: pip install pandas openpyxl python-docx

      - name: Merge the seven daily classified workbooks
        if: steps.weekly_gate.outputs.run == 'true'
        run: python aggregate_daily_classified.py -c classification.txt --days 7

      - name: Commit weekly merged workbook
        if: steps.weekly_gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add output/weekly_classified/*.xlsx || true
          if git diff --cached --quiet; then
            echo "No new weekly workbook; repeated aggregation was skipped"
            exit 0
          fi

          git commit -m "chore: weekly merge of daily classified xlsx (UTC $(date -u +'%Y-%m-%d'))"
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main
