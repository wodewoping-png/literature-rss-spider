name: One-time cleanup of completed branches

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup_completed_branches_once.yaml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete only the reviewed branch heads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          expected = json.loads("{\"agent/cleanup-redundant-files\":\"eea0eeccffe4009fdb5ecb090751b199b8c5d7be\",\"agent/fix-monthly-doi-fills\":\"2f950be5bf088ecc59ba2963efdf6606d3ff9d62\",\"agent/optimize-architecture\":\"5a860130aac85d72a80220bbab0797644e776f0c\",\"agent/restore-pre-today-code\":\"6edae3fdab6fd2b2874215f2f25c20a8f3fbabbb\",\"codex/daily-industry-classification\":\"4d4b8563e063dad827e52db1b3e91754efbbd953\",\"codex/dedupe-literature-by-doi-20260925\":\"4a31422670564df26826645ec5af1e200daff29e\",\"codex/fix-daily-backfill-alerts\":\"561fcd235712c22c3cac25bafd8155e314e1047d\",\"codex/fix-pnas-rss-fallback-20260922\":\"7bd7f9f6beea5ca6f3ebee8fb001ec071e64616b\",\"codex/monthly-industry-compatibility-fix\":\"dca5a1e532b8e80e6bc780c61d036e5515da0820\",\"codex/monthly-industry-taxonomy\":\"787aa58abab24200403e5102759d41cc9259f31e\",\"fix/daily-classification-duplicate-rows\":\"395a4b8e7a176a7098689b9d00aa8b74e8fe1b82\",\"fix/friday-only-weekly-classified\":\"85338c26b950a8ea1e5b3a9496eed31394430c26\",\"fix/publisher-alert-after-repair\":\"1d25c814666b08942f187182c44256e410a26c21\"}")
          repository = os.environ["GH_REPOSITORY"]
          assert repository == "wodewoping-png/literature-rss-spider"
          assert "main" not in expected and len(expected) == 13

          def api(path, method="GET"):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repository + "/" + path,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          open_heads = {pr["head"]["ref"] for pr in api("pulls?state=open&per_page=100")}
          assert not (open_heads & expected.keys()), "A reviewed branch has an open PR"
          # Validate the entire fixed list before deleting any branch.
          for name, sha in expected.items():
              ref = "git/ref/heads/" + urllib.parse.quote(name, safe="/")
              current = api(ref)["object"]["sha"]
              assert current == sha, "Branch changed; cleanup stopped: " + name

          for name, sha in expected.items():
              ref = "git/ref/heads/" + urllib.parse.quote(name, safe="/")
              assert api(ref)["object"]["sha"] == sha, "Branch changed: " + name
              api("git/refs/heads/" + urllib.parse.quote(name, safe="/"), "DELETE")
              print("Deleted " + name, flush=True)

          remaining = api("branches?per_page=100")
          assert any(branch["name"] == "main" for branch in remaining)
          assert not (expected.keys() & {branch["name"] for branch in remaining})
          print("Cleanup complete: all 13 reviewed branches deleted; main retained.")
          PY
