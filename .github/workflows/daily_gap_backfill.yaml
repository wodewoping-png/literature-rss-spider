name: Daily RSS Gap Check and Backfill

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily_gap_backfill.yaml"
      - ".github/workflows/rss_abs.yaml"
      - "requirements-spider.txt"
      - "scripts/check_daily_gaps.py"
      - "scripts/check_crossref_fallback_sources.py"
      - "scripts/check_feed_endpoints.py"
      - "scripts/check_nature_sustainability.py"
      - "scripts/send_dingtalk_alert.py"
      - "spider0301.py"
      - "feeds1211.txt"
  schedule:
    # Check the prior seven complete UTC days. This intentionally avoids a
    # false gap while today's 02:00 UTC spider is still running.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      end_date:
        description: "Last UTC output date to check (YYYY-MM-DD); blank means yesterday"
        required: false
        type: string
      test_dingtalk:
        description: "Send a real DingTalk test alert"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: rss-spider-main
  cancel-in-progress: false

jobs:
  check-and-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Detect missing or empty daily outputs
        id: gaps
        env:
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          args=(--days 7 --github-output "$GITHUB_OUTPUT")
          if [ -n "$END_DATE" ]; then
            args+=(--end-date "$END_DATE")
          else
            args+=(--end-date "$(date -u -d 'yesterday' +'%Y-%m-%d')")
          fi
          python scripts/check_daily_gaps.py "${args[@]}"

      - name: Install source-health dependencies
        run: pip install feedparser requests

      - name: Send real DingTalk test alert
        id: dingtalk_test
        continue-on-error: true
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.test_dingtalk) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[test-dingtalk]'))
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK || secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_ACCESS_TOKEN: ${{ secrets.DINGTALK_ACCESS_TOKEN || secrets.DINGTALK_TOKEN }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python scripts/send_dingtalk_alert.py
          --title "Literature RSS Nature journal alert TEST"
          --message "DingTalk delivery test from ${GITHUB_REPOSITORY}. No action is required. run=${RUN_URL}"

      - name: Detect direct Nature journal omissions
        id: nature_source
        continue-on-error: true
        env:
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          end_date="${END_DATE:-$(date -u -d 'yesterday' +'%Y-%m-%d')}"
          python scripts/check_nature_sustainability.py \
            --days 7 \
            --end-date "$end_date" \
            --all-direct-nature \
            --github-output "$GITHUB_OUTPUT"

      - name: Attempt direct Nature journal repair once
        if: >-
          always() &&
          (steps.nature_source.outcome == 'failure' || steps.nature_source.outputs.missing_count != '0')
        id: nature_repair
        continue-on-error: true
        env:
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          end_date="${END_DATE:-$(date -u -d 'yesterday' +'%Y-%m-%d')}"
          python scripts/check_nature_sustainability.py \
            --days 7 \
            --end-date "$end_date" \
            --repair-date "$end_date" \
            --all-direct-nature \
            --github-output "$GITHUB_OUTPUT" \
            --fail-on-missing

      - name: Send high-priority Nature omission alert
        id: nature_priority_alert
        continue-on-error: true
        if: >-
          always() &&
          (steps.nature_source.outcome == 'failure' || steps.nature_source.outputs.missing_count != '0')
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK || secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_ACCESS_TOKEN: ${{ secrets.DINGTALK_ACCESS_TOKEN || secrets.DINGTALK_TOKEN }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          NATURE_INITIAL_MISSING: ${{ steps.nature_source.outputs.initial_missing_count }}
          NATURE_REMAINING: ${{ steps.nature_repair.outputs.missing_count }}
          NATURE_JOURNALS: ${{ steps.nature_source.outputs.missing_journals }}
          NATURE_SAMPLE: ${{ steps.nature_repair.outputs.missing_sample || steps.nature_source.outputs.missing_sample }}
          NATURE_ERROR: ${{ steps.nature_repair.outputs.error || steps.nature_source.outputs.error }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python scripts/send_dingtalk_alert.py
          --title "HIGH PRIORITY - Nature journal omission alert"
          --message "repository=${GITHUB_REPOSITORY}; initially_missing=${NATURE_INITIAL_MISSING:-unknown}; remaining_after_repair=${NATURE_REMAINING:-unknown}; journals=${NATURE_JOURNALS:-unknown}; sample=${NATURE_SAMPLE:-none}; error=${NATURE_ERROR:-none}; run=${RUN_URL}"

      - name: Detect high-priority RSC journal omissions
        id: rsc_source
        continue-on-error: true
        env:
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          end_date="${END_DATE:-$(date -u -d 'yesterday' +'%Y-%m-%d')}"
          python scripts/check_crossref_fallback_sources.py \
            --days 7 \
            --end-date "$end_date" \
            --only-rsc \
            --github-output "$GITHUB_OUTPUT"

      - name: Attempt high-priority RSC repair once
        if: >-
          always() &&
          (steps.rsc_source.outcome == 'failure' || steps.rsc_source.outputs.missing_count != '0')
        id: rsc_repair
        continue-on-error: true
        env:
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          end_date="${END_DATE:-$(date -u -d 'yesterday' +'%Y-%m-%d')}"
          python scripts/check_crossref_fallback_sources.py \
            --days 7 \
            --end-date "$end_date" \
            --repair-date "$end_date" \
            --only-rsc \
            --github-output "$GITHUB_OUTPUT" \
            --fail-on-missing

      - name: Send high-priority RSC omission alert
        id: rsc_priority_alert
        continue-on-error: true
        if: >-
          always() &&
          (steps.rsc_source.outcome == 'failure' || steps.rsc_source.outputs.missing_count != '0')
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK || secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_ACCESS_TOKEN: ${{ secrets.DINGTALK_ACCESS_TOKEN || secrets.DINGTALK_TOKEN }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          RSC_INITIAL_MISSING: ${{ steps.rsc_source.outputs.initial_missing_count }}
          RSC_REMAINING: ${{ steps.rsc_repair.outputs.missing_count }}
          RSC_JOURNALS: ${{ steps.rsc_source.outputs.missing_journals }}
          RSC_SAMPLE: ${{ steps.rsc_repair.outputs.missing_sample || steps.rsc_source.outputs.missing_sample }}
          RSC_ERROR: ${{ steps.rsc_repair.outputs.error || steps.rsc_source.outputs.error }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::warning title=HIGH PRIORITY RSC omission::initial=${RSC_INITIAL_MISSING:-unknown}; remaining=${RSC_REMAINING:-unknown}; journals=${RSC_JOURNALS:-unknown}; sample=${RSC_SAMPLE:-none}"
          python scripts/send_dingtalk_alert.py \
            --title "HIGH PRIORITY - RSC journal omission alert" \
            --message "repository=${GITHUB_REPOSITORY}; initially_missing=${RSC_INITIAL_MISSING:-unknown}; remaining_after_repair=${RSC_REMAINING:-unknown}; journals=${RSC_JOURNALS:-unknown}; sample=${RSC_SAMPLE:-none}; error=${RSC_ERROR:-none}; run=${RUN_URL}"

      - name: Check all RSS endpoints and fallback channels
        id: feed_health
        continue-on-error: true
        env:
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          end_date="${END_DATE:-$(date -u -d 'yesterday' +'%Y-%m-%d')}"
          python scripts/check_feed_endpoints.py \
            --end-date "$end_date" \
            --github-output "$GITHUB_OUTPUT"

      - name: Detect fallback-journal DOI omissions
        id: crossref_source
        continue-on-error: true
        env:
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          end_date="${END_DATE:-$(date -u -d 'yesterday' +'%Y-%m-%d')}"
          python scripts/check_crossref_fallback_sources.py \
            --days 7 \
            --end-date "$end_date" \
            --exclude-rsc \
            --github-output "$GITHUB_OUTPUT"

      - name: Recheck unhealthy feeds once
        if: >-
          always() &&
          (steps.feed_health.outcome == 'failure' || steps.feed_health.outputs.unhealthy_count != '0')
        id: feed_recheck
        continue-on-error: true
        env:
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          end_date="${END_DATE:-$(date -u -d 'yesterday' +'%Y-%m-%d')}"
          python scripts/check_feed_endpoints.py \
            --end-date "$end_date" \
            --github-output "$GITHUB_OUTPUT" \
            --fail-on-unhealthy

      - name: Install spider dependencies
        if: steps.gaps.outputs.missing_count != '0'
        run: |
          python -m pip install -U pip
          pip install -r requirements-spider.txt

      - name: Attempt each missing date once
        if: steps.gaps.outputs.missing_count != '0'
        id: backfill
        env:
          MISSING_DATES: ${{ steps.gaps.outputs.missing_dates }}
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          PLAYWRIGHT_HEADLESS: "1"
          PLAYWRIGHT_CHANNEL: "chrome"
        run: |
          failed_dates=""
          for day in $MISSING_DATES; do
            echo "Attempting one backfill for UTC output date $day"
            if ! RUN_DATE="$day" timeout 70m python -u spider0301.py; then
              echo "Backfill process failed for $day"
            fi
            if ! python scripts/check_daily_gaps.py --dates "$day" --fail-on-gap; then
              failed_dates="${failed_dates} ${day}"
            fi
          done
          failed_dates="${failed_dates# }"
          echo "failed_dates=$failed_dates" >> "$GITHUB_OUTPUT"

      - name: Attempt fallback-journal repair once
        if: >-
          always() &&
          (steps.crossref_source.outcome == 'failure' || steps.crossref_source.outputs.missing_count != '0')
        id: crossref_repair
        continue-on-error: true
        env:
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          end_date="${END_DATE:-$(date -u -d 'yesterday' +'%Y-%m-%d')}"
          python scripts/check_crossref_fallback_sources.py \
            --days 7 \
            --end-date "$end_date" \
            --repair-date "$end_date" \
            --exclude-rsc \
            --github-output "$GITHUB_OUTPUT" \
            --fail-on-missing

      - name: Commit successful backfills
        if: >-
          always() &&
          (steps.gaps.outputs.missing_count != '0' ||
           steps.nature_source.outcome == 'failure' ||
           steps.nature_source.outputs.missing_count != '0' ||
           steps.rsc_source.outcome == 'failure' ||
           steps.rsc_source.outputs.missing_count != '0' ||
           steps.crossref_source.outcome == 'failure' ||
           steps.crossref_source.outputs.missing_count != '0')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISSING_DATES: ${{ steps.gaps.outputs.missing_dates }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          for day in $MISSING_DATES; do
            path="output/news_with_abstract_${day}.csv"
            if [ -f "$path" ]; then
              git add -- "$path"
            fi
          done
          end_date="${END_DATE:-$(date -u -d 'yesterday' +'%Y-%m-%d')}"
          nature_path="output/news_with_abstract_${end_date}.csv"
          if [ -f "$nature_path" ]; then
            git add -- "$nature_path"
          fi
          if git diff --cached --quiet; then
            echo "No successful backfill files to commit"
            exit 0
          fi

          git commit -m "chore: backfill missing daily RSS results"
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Send DingTalk gap alert
        id: dingtalk_alert
        continue-on-error: true
        if: >-
          always() &&
          (failure() ||
           steps.backfill.outputs.failed_dates != '' ||
           steps.nature_repair.outcome == 'failure' ||
           steps.nature_repair.outputs.missing_count != '0' ||
           steps.rsc_repair.outcome == 'failure' ||
           steps.rsc_repair.outputs.missing_count != '0' ||
           steps.crossref_repair.outcome == 'failure' ||
           steps.crossref_repair.outputs.missing_count != '0' ||
           steps.feed_recheck.outcome == 'failure' ||
           (steps.feed_recheck.outcome == 'success' &&
            steps.feed_recheck.outputs.unhealthy_count != '0'))
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK || secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_ACCESS_TOKEN: ${{ secrets.DINGTALK_ACCESS_TOKEN || secrets.DINGTALK_TOKEN }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DETECTED_DATES: ${{ steps.gaps.outputs.missing_dates }}
          FAILED_DATES: ${{ steps.backfill.outputs.failed_dates }}
          NATURE_MISSING_DOIS: ${{ steps.nature_repair.outputs.missing_dois || steps.nature_source.outputs.missing_dois }}
          NATURE_ERROR: ${{ steps.nature_repair.outputs.error || steps.nature_source.outputs.error }}
          RSC_MISSING_DOIS: ${{ steps.rsc_repair.outputs.missing_sample || steps.rsc_source.outputs.missing_sample }}
          RSC_ERROR: ${{ steps.rsc_repair.outputs.error || steps.rsc_source.outputs.error }}
          CROSSREF_MISSING_DOIS: ${{ steps.crossref_repair.outputs.missing_sample || steps.crossref_source.outputs.missing_sample }}
          CROSSREF_ERROR: ${{ steps.crossref_repair.outputs.error || steps.crossref_source.outputs.error }}
          UNHEALTHY_FEEDS: ${{ steps.feed_recheck.outputs.unhealthy_feeds || steps.feed_health.outputs.unhealthy_feeds }}
          FALLBACK_FEEDS: ${{ steps.feed_recheck.outputs.fallback_feeds || steps.feed_health.outputs.fallback_feeds }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python scripts/send_dingtalk_alert.py
          --title "Literature RSS daily gap alert"
          --message "repository=${GITHUB_REPOSITORY}; daily_gaps=${DETECTED_DATES:-none}; still_missing_dates=${FAILED_DATES:-none}; nature_journal_missing=${NATURE_MISSING_DOIS:-none}; nature_error=${NATURE_ERROR:-none}; rsc_missing=${RSC_MISSING_DOIS:-none}; rsc_error=${RSC_ERROR:-none}; fallback_journal_missing=${CROSSREF_MISSING_DOIS:-none}; fallback_error=${CROSSREF_ERROR:-none}; unhealthy_feeds=${UNHEALTHY_FEEDS:-none}; active_fallbacks=${FALLBACK_FEEDS:-none}; run=${RUN_URL}"

      - name: Report DingTalk delivery failure
        if: >-
          always() &&
          (steps.dingtalk_test.outcome == 'failure' ||
           steps.nature_priority_alert.outcome == 'failure' ||
           steps.rsc_priority_alert.outcome == 'failure' ||
           steps.dingtalk_alert.outcome == 'failure')
        run: >-
          echo "::error title=DingTalk alert delivery failed::test=${{ steps.dingtalk_test.outcome }}, nature_priority=${{ steps.nature_priority_alert.outcome }}, rsc_priority=${{ steps.rsc_priority_alert.outcome }}, general=${{ steps.dingtalk_alert.outcome }}. Configure DINGTALK_WEBHOOK/DINGTALK_WEBHOOK_URL or DINGTALK_ACCESS_TOKEN/DINGTALK_TOKEN, plus optional DINGTALK_SECRET; then check robot keyword/IP policy."

      - name: Fail when gaps or source omissions remain after the single attempt
        if: >-
          always() &&
          (steps.backfill.outputs.failed_dates != '' ||
           steps.nature_repair.outcome == 'failure' ||
           steps.nature_repair.outputs.missing_count != '0' ||
           steps.rsc_repair.outcome == 'failure' ||
           steps.rsc_repair.outputs.missing_count != '0' ||
           steps.crossref_repair.outcome == 'failure' ||
           steps.crossref_repair.outputs.missing_count != '0' ||
           steps.feed_recheck.outcome == 'failure' ||
           (steps.feed_recheck.outcome == 'success' &&
            steps.feed_recheck.outputs.unhealthy_count != '0'))
        env:
          FAILED_DATES: ${{ steps.backfill.outputs.failed_dates }}
          NATURE_MISSING_DOIS: ${{ steps.nature_repair.outputs.missing_dois }}
          RSC_MISSING_DOIS: ${{ steps.rsc_repair.outputs.missing_sample }}
          CROSSREF_MISSING_DOIS: ${{ steps.crossref_repair.outputs.missing_sample }}
          UNHEALTHY_FEEDS: ${{ steps.feed_recheck.outputs.unhealthy_feeds }}
        run: |
          echo "Daily outputs still missing or invalid: $FAILED_DATES"
          echo "Direct Nature journal records still missing: $NATURE_MISSING_DOIS"
          echo "Priority RSC journal records still missing: $RSC_MISSING_DOIS"
          echo "Fallback-journal records still missing: $CROSSREF_MISSING_DOIS"
          echo "RSS endpoints/fallbacks still unhealthy: $UNHEALTHY_FEEDS"
          echo "::error title=RSS feed health check failed::Unhealthy feeds: ${UNHEALTHY_FEEDS:-unknown}; missing dates: ${FAILED_DATES:-none}; Nature DOI gaps: ${NATURE_MISSING_DOIS:-none}; RSC DOI gaps: ${RSC_MISSING_DOIS:-none}; fallback DOI gaps: ${CROSSREF_MISSING_DOIS:-none}"
          exit 1

      - name: Fail when DingTalk delivery is unavailable
        if: >-
          always() &&
          (steps.dingtalk_test.outcome == 'failure' ||
           steps.nature_priority_alert.outcome == 'failure' ||
           steps.rsc_priority_alert.outcome == 'failure' ||
           steps.dingtalk_alert.outcome == 'failure')
        run: |
          echo "::error title=DingTalk delivery unavailable::A required DingTalk test or alert could not be delivered. See the earlier configuration/rejection annotation."
          exit 1
