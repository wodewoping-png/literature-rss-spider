name: Daily RSS Gap Check and Backfill

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily_gap_backfill.yaml"
      - ".github/workflows/rss_abs.yaml"
      - "requirements-spider.txt"
      - "scripts/check_daily_gaps.py"
      - "scripts/send_dingtalk_alert.py"
      - "spider0301.py"
  schedule:
    # Check the prior seven complete UTC days. This intentionally avoids a
    # false gap while today's 02:00 UTC spider is still running.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      end_date:
        description: "Last UTC output date to check (YYYY-MM-DD); blank means yesterday"
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: rss-spider-main
  cancel-in-progress: false

jobs:
  check-and-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Detect missing or empty daily outputs
        id: gaps
        env:
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          args=(--days 7 --github-output "$GITHUB_OUTPUT")
          if [ -n "$END_DATE" ]; then
            args+=(--end-date "$END_DATE")
          else
            args+=(--end-date "$(date -u -d 'yesterday' +'%Y-%m-%d')")
          fi
          python scripts/check_daily_gaps.py "${args[@]}"

      - name: Install spider dependencies
        if: steps.gaps.outputs.missing_count != '0'
        run: |
          python -m pip install -U pip
          pip install -r requirements-spider.txt

      - name: Attempt each missing date once
        if: steps.gaps.outputs.missing_count != '0'
        id: backfill
        env:
          MISSING_DATES: ${{ steps.gaps.outputs.missing_dates }}
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          PLAYWRIGHT_HEADLESS: "1"
          PLAYWRIGHT_CHANNEL: "chrome"
        run: |
          failed_dates=""
          for day in $MISSING_DATES; do
            echo "Attempting one backfill for UTC output date $day"
            if ! RUN_DATE="$day" timeout 70m python -u spider0301.py; then
              echo "Backfill process failed for $day"
            fi
            if ! python scripts/check_daily_gaps.py --dates "$day" --fail-on-gap; then
              failed_dates="${failed_dates} ${day}"
            fi
          done
          failed_dates="${failed_dates# }"
          echo "failed_dates=$failed_dates" >> "$GITHUB_OUTPUT"

      - name: Commit successful backfills
        if: steps.gaps.outputs.missing_count != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISSING_DATES: ${{ steps.gaps.outputs.missing_dates }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          for day in $MISSING_DATES; do
            path="output/news_with_abstract_${day}.csv"
            if [ -f "$path" ]; then
              git add -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No successful backfill files to commit"
            exit 0
          fi

          git commit -m "chore: backfill missing daily RSS results"
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Send DingTalk gap alert
        if: >-
          always() &&
          (failure() || steps.backfill.outputs.failed_dates != '')
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK || secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DETECTED_DATES: ${{ steps.gaps.outputs.missing_dates }}
          FAILED_DATES: ${{ steps.backfill.outputs.failed_dates }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python scripts/send_dingtalk_alert.py
          --title "Literature RSS daily gap alert"
          --message "repository=${GITHUB_REPOSITORY}; detected=${DETECTED_DATES:-workflow-error}; still_missing=${FAILED_DATES:-workflow-error}; run=${RUN_URL}"

      - name: Fail when gaps remain after the single attempt
        if: steps.backfill.outputs.failed_dates != ''
        env:
          FAILED_DATES: ${{ steps.backfill.outputs.failed_dates }}
        run: |
          echo "Daily outputs still missing or invalid: $FAILED_DATES"
          exit 1
